         游戏界面本来就是中文，不需要翻译。 -->
    <meta name="google" content="notranslate" />
    <title>绒兽杀</title>

        <div style="font-size:48px;margin-bottom:16px;">🎮</div>
        <div style="font-size:18px;font-weight:bold;color:#e2e8f0;">绒兽杀</div>
        <div style="font-size:12px;margin-top:8px;">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script nomodule>
      document.getElementById('root').innerHTML = '您的浏览器不支持ES模块';
    </script>
  </body>
</html>
